name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go — lint, unit + integration tests
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_ADDR: localhost:9000
      KAFKA_BROKERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Same compose file as local dev, so CI exercises the exact infrastructure versions.
      - name: Start Redpanda and ClickHouse
        run: docker compose up -d --wait redpanda clickhouse
      - name: Generated code is up to date
        run: go generate ./... && git diff --exit-code internal/api
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Unit + integration tests incl. crash recovery (race detector)
        run: go test -race -count=1 ./...
      - run: go build -o bin/ ./cmd/...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dashboard:
    name: Dashboard — typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: npm run generate && git diff --exit-code src/api/schema.gen.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Full stack — exactly-once load test + Playwright
    runs-on: ubuntu-latest
    needs: [go, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cp .env.example .env
      - name: Start stack (infra + services + dashboard)
        run: docker compose --profile app up -d --build --wait
      - name: Load test with exactly-once verification
        run: make verify RATE=20000 DURATION=20s
      - name: Playwright
        working-directory: dashboard
        env:
          DASHBOARD_URL: http://localhost:8088
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Keep live traffic flowing while the browser tests run.
          (cd .. && set -a && source .env && set +a && go run ./cmd/loadgen -rate 2000 -duration 3m) &
          sleep 5
          npm run test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report

  images:
    name: Publish images
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: services
            dockerfile: Dockerfile
          - name: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/live-analytics-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/live-analytics-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
